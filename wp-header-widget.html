#pb-header .pbnav-links{position:relative;z-index:2;display:none;align-items:center;gap:2px;margin:0 auto;padding:5px 10px;background:#fff;border:1px solid #f1eff6;border-radius:16px;box-shadow:0 6px 18px -8px rgba(24,24,27,.12)}

#pb-header .pbnav-quote{display:none;align-items:center;gap:8px;padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6 0%,#6d28d9 55%,#4f46e5 100%);color:#fff;font-size:14px;font-weight:500;line-height:1.2;white-space:nowrap;box-shadow:0 8px 20px -8px rgba(109,40,217,.6),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .15s ease,box-shadow .2s ease}
#pb-header .pbnav-quote svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
#pb-header .pbnav-quote:hover{color:#fff;transform:translateY(-1px);box-shadow:0 12px 24px -8px rgba(109,40,217,.7),inset 0 1px 0 rgba(255,255,255,.25)}
#pb-header .pbnav-quote:hover svg{transform:translateX(3px)}
#pb-header .pbnav-toggle{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;min-height:0;margin:0;padding:0;border:0;border-radius:12px;background:transparent;color:#52525b;cursor:pointer;box-shadow:none;-webkit-appearance:none;appearance:none;transition:background .15s ease}
#pb-header .pbnav-toggle:hover,#pb-header .pbnav-toggle[aria-expanded="true"]{background:#f1eff6;color:#52525b}
#pb-header .pbnav-toggle svg{fill:currentColor}
#pb-header a:focus-visible,#pb-header .pbnav-toggle:focus-visible{outline:2px solid rgba(124,58,237,.35);outline-offset:2px}
#pb-header .pbnav-menu{position:absolute;top:calc(100% + 8px);left:20px;right:20px;z-index:1001;display:none;flex-direction:column;max-width:1320px;margin:0 auto;padding:14px 18px 18px;background:#fff;border:1px solid #efedf5;border-radius:20px;box-shadow:0 16px 36px -14px rgba(76,29,149,.22)}

#pb-header .pbnav-menu .pbnav-menu-phone:hover{background:#ddd6fe;color:#5b21b6}
#pb-header .pbnav-menu .pbnav-menu-quote{justify-content:center;margin-top:12px;padding:12px;border:0;border-radius:14px;background:#7c3aed;color:#fff}

@media (min-width:768px){#pb-header .pbnav-quote{display:inline-flex}#pb-header .pbnav-menu .pbnav-menu-quote{display:none}}

@media (max-width:599px){#pb-header{padding:10px 10px 0}#pb-header .pbnav-card{min-height:64px;padding-right:6px;border-radius:20px}#pb-header .pbnav-logo{padding:0 30px 0 14px}#pb-header .pbnav-logo img{height:32px!important}#pb-header .pbnav-logo::after{width:72px}#pb-header .pbnav-actions{gap:2px}#pb-header .pbnav-menu{left:10px;right:10px}}

</style>

<script>
(function(){
  var nav=document.getElementById('pb-header');
  if(!nav||nav.getAttribute('data-ready'))return;
  nav.setAttribute('data-ready','1');
  var btn=nav.querySelector('.pbnav-toggle'),menu=nav.querySelector('.pbnav-menu');
  function setOpen(open){
    menu.classList.toggle('is-open',open);
    btn.setAttribute('aria-expanded',open?'true':'false');
    btn.setAttribute('aria-label',open?'Close menu':'Open menu');
  }
  btn.addEventListener('click',function(e){e.stopPropagation();setOpen(!menu.classList.contains('is-open'));});
  menu.addEventListener('click',function(e){if(e.target.closest('a'))setOpen(false);});
  document.addEventListener('click',function(e){if(menu.classList.contains('is-open')&&!nav.contains(e.target))setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&menu.classList.contains('is-open')){setOpen(false);btn.focus();}});
  var badge=document.getElementById('pbHeaderCartBadge');
  try{
    var items=JSON.parse(localStorage.getItem('pbCartItems')||'[]');
    var count=Array.isArray(items)?items.reduce(function(t,x){return t+(Number(x.qty)||0);},0):0;
    badge.textContent=String(count);
    if(count>0)badge.classList.add('has-items');
  }catch(e){}
})();
</script>
